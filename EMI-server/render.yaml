# Render Blueprint: creates the PostgreSQL database and the EMI server together
# and wires the database credentials into the server automatically.
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo.

databases:
  - name: emi-db
    databaseName: emi
    user: emi
    plan: free
    region: singapore
    ipAllowList: []          # internal access only (no public connections)

services:
  - type: web
    name: emi-server
    runtime: docker
    plan: free
    region: singapore        # must match the database region for the internal hostname
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ---- Database (injected from emi-db) ----
      - key: DB_HOST
        fromDatabase:
          name: emi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: emi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: emi-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: emi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: emi-db
          property: password

      # ---- App ----
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "2592000000"
      - key: CORS_ALLOWED_ORIGINS   # comma-separated, e.g. https://app.example.com
        sync: false

      # ---- Storage (set values in the Render dashboard) ----
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false

      # ---- Mail ----
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
