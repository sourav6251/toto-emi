notification.mail.protocol=${MAIL_PROTOCOL:smtp}
notification.mail.auth=${MAIL_AUTH:true}
notification.mail.isTlsEnable=${MAIL_IS_TLS_ENABLE:true}
notification.mail.isDebug=${MAIL_IS_DEBUG:false}

